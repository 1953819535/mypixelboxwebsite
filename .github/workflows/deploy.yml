name: Deploy to Aliyun ECS

on:
  # 每次推送到 main 分支时触发
  push:
    branches: [main]
  # 允许手动触发
  workflow_dispatch:
  # 定时任务 (保持你原来的时间)
  schedule:
    - cron: "17 21 * * *"

# 只需要读取代码的权限
permissions:
  contents: read

# 允许并发，但如果正在部署新版本，就不用取消旧的（按需调整）
concurrency:
  group: "aliyun-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. 安装依赖
      - name: Install dependencies
        run: npm install

      # 4. 构建 Astro 项目
      - name: Build with Astro
        run: |
          npm run build
        env:
          # 注入环境变量
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          TEST_MODE: "false"
        # 注意：Astro 默认构建输出目录是 dist/，请确保这里没改过

      # 5. 【核心变化】部署到阿里云服务器
      - name: Deploy to Aliyun Server
        uses: easingthemes/ssh-deploy@main
        env:
          # SSH 私钥
          SSH_PRIVATE_KEY: ${{ secrets.ALIYUN_SSH_KEY }}
          # 服务器 IP (101.37.37.228)
          REMOTE_HOST: ${{ secrets.ALIYUN_IP }}
          # 登录用户 (通常是 root)
          REMOTE_USER: "root"
          
          # 本地构建好的文件夹 (Astro 默认是 dist/)
          SOURCE: "dist/"
          
          # 服务器上的目标路径 (你指定的路径)
          TARGET: "/srv/apps/website"
          
          # 参数：递归、保留属性、删除服务器上旧文件以保持同步
          ARGS: "-rltgoDzvO --delete"